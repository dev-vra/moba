<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>EKOOFALL: ARENA</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#11161d;font-family:"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 30% 60%,#0f2a36,transparent 55%),radial-gradient(circle at 72% 40%,#3a1e0e,transparent 55%),#0b0f14;
    color:#cfe7ee;transition:opacity .7s;z-index:10;font-family:"Segoe UI",Roboto,system-ui,sans-serif;text-align:center}
  #boot h1{margin:0;font-size:clamp(34px,7vw,84px);font-weight:900;letter-spacing:.14em;color:#d8c9b4;text-shadow:0 3px 0 #20160f,0 0 30px rgba(0,0,0,.8)}
  #boot h2{margin:0 0 26px;font-size:clamp(16px,3vw,34px);letter-spacing:.6em;color:#5fe6ff;text-shadow:0 0 18px #19c8ee;font-weight:800}
  #boot p{margin:14px 0 0;font-size:12px;letter-spacing:.3em;color:#8aa0b2}
  #boot .track{width:min(420px,70vw);height:6px;margin:0 auto;background:#1a222b;border:1px solid #3a4652;border-radius:3px;overflow:hidden}
  #boot .track i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#19c8ee,#ffa23a);transition:width .25s}
  #boot.off{opacity:0;pointer-events:none}
  @media (pointer:coarse){#hint{display:none}}
  #hint{position:fixed;left:50%;top:72px;z-index:6;transform:translateX(-50%);color:#cfe7ee;font-size:12px;letter-spacing:.08em;
    background:rgba(12,18,24,.72);border:1px solid rgba(120,230,255,.35);padding:6px 14px;border-radius:4px;white-space:nowrap}
  #hint{animation:hintOut 1s 9s forwards}@keyframes hintOut{to{opacity:0;visibility:hidden}}
  #logo{position:fixed;left:14px;top:10px;font-weight:900;font-size:16px;letter-spacing:.12em;color:#d8c9b4;
    text-shadow:0 2px 0 #20160f,0 0 12px rgba(0,0,0,.6)}
  #quality{position:fixed;right:14px;top:10px;z-index:6;background:rgba(12,18,24,.72);color:#cfe7ee;border:1px solid rgba(120,230,255,.35);
    padding:6px 12px;border-radius:4px;font:700 11px/1 inherit;letter-spacing:.12em;cursor:pointer}
  #logo b{display:block;font-size:13px;letter-spacing:.5em;color:#5fe6ff;text-shadow:0 0 10px #19c8ee}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="logo">EKOOFALL<b>ARENA</b></div>
<button id="quality"></button>
<div id="hint">WASD mover · mouse mira · clique/ESPAÇO ataca · Q E R habilidades · F ultimate · P loja · botão direito: ir até</div>
<div id="boot"><div><h1>EKOOFALL</h1><h2>ARENA</h2><div class="track"><i id="bootbar"></i></div><p>CARREGANDO A CIDADE-CELEIRO · 2049</p></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
